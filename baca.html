
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Buku Cerita - Kit Budi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fc;
            color: #263f78;
        }

        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: white;
        }

        .logo {
            width: 75px;
            height: auto;
        }

        button {
            border: none;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* HALAMAN UTAMA - 2 KALI GANDA */

        .home {
            background: #ed9c2f;
            padding: 28px 48px;
            font-size: 32px;
        }

        /* TAJUK BUKU */

        .book-heading {
            text-align: center;
            padding: 15px;
        }

        .book-heading h2 {
            margin: 5px;
            font-size: 28px;
        }

        /* BUTANG FULLSCREEN - 2 KALI GANDA */

        .fullscreen-container {
            text-align: center;
            margin: 5px 0 15px;
        }

        .fullscreen-btn {
            background: #4260b0;
            padding: 30px 48px;
            font-size: 36px;
        }

        .fullscreen-btn:hover {
            background: #263f78;
        }

        /* PAPARAN BUKU */

        .book-frame {
            display: block;
            width: 100%;
            height: 75vh;
            border: none;
            background: white;
        }

        /* FULLSCREEN BUKU SAHAJA */

        .book-frame:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            border: none;
            background: white;
        }

        .book-frame:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            border: none;
            background: white;
        }

        /* BUTANG BAWAH - 2 KALI GANDA */

        .bottom-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 25px 20px;
        }

        .bottom-buttons button {
            padding: 28px 48px;
            font-size: 32px;
            font-weight: bold;
            line-height: 1.3;
            border-radius: 50px;
        }

        .back {
            background: #777;
        }

        .next {
            background: #299b63;
        }

        /* TABLET */

        @media (max-width: 1000px) {

            .home {
                padding: 22px 32px;
                font-size: 26px;
            }

            .fullscreen-btn {
                padding: 24px 36px;
                font-size: 30px;
            }

            .bottom-buttons button {
                padding: 22px 32px;
                font-size: 26px;
            }
        }

        /* TELEFON */

        @media (max-width: 600px) {

            header {
                padding: 10px 12px;
                gap: 10px;
            }

            .logo {
                width: 60px;
            }

            .home {
                padding: 16px 20px;
                font-size: 20px;
            }

            .book-heading h2 {
                font-size: 23px;
            }

            .fullscreen-btn {
                padding: 18px 24px;
                font-size: 22px;
            }

            .book-frame {
                height: 70vh;
            }

            .bottom-buttons {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
                padding: 20px 12px;
            }

            .bottom-buttons button {
                width: 100%;
                padding: 20px 18px;
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

<header>
    <img src="assets/images/logo-kit-budi.jpg"
         class="logo"
         alt="Logo Kit Budi">

    <button class="home"
            onclick="location.href='index.html'">
        🏠 HALAMAN UTAMA
    </button>
</header>

<!-- TAJUK BUKU -->

<div class="book-heading">
    <h2>📖 MASA MEMBACA!</h2>
    <p id="bookTitle"></p>
</div>

<!-- BUTANG FULLSCREEN -->

<div class="fullscreen-container">
    <button class="fullscreen-btn"
            id="fullscreenButton"
            type="button">
        ⛶ BESARKAN BUKU (FULLSCREEN)
    </button>
</div>

<!-- PAPARAN BUKU -->

<iframe
    id="bookFrame"
    class="book-frame"
    title="Buku cerita pilihan"
    allowfullscreen
    webkitallowfullscreen
    allow="fullscreen">
</iframe>

<!-- BUTANG BAWAH -->

<div class="bottom-buttons">

    <button class="back"
            onclick="location.href='pilihbuku.html'">
        ↩ KEMBALI KE PILIH BUKU
    </button>

    <button class="next"
            id="continueButton">
        SAYA SUDAH SELESAI MEMBACA →
        TERUSKAN KE PERMAINAN
    </button>

</div>

<script>

    // ======================================
    // MAKLUMAT BUKU
    // ======================================

    const bookUrl =
        sessionStorage.getItem("selectedBookUrl");

    const bookTitle =
        sessionStorage.getItem("selectedBookTitle");

    const bookFrame =
        document.getElementById("bookFrame");

    const fullscreenButton =
        document.getElementById("fullscreenButton");


    // ======================================
    // PAPARKAN TAJUK BUKU
    // ======================================

    document.getElementById("bookTitle").textContent =
        bookTitle || "Buku Cerita";


    // ======================================
    // PAPARKAN BUKU
    // ======================================

    if (bookUrl) {

        bookFrame.src = bookUrl;

    } else {

        document.getElementById("bookTitle").textContent =
            "Pautan buku tidak dijumpai. Sila pilih buku semula.";

    }


    // ======================================
    // FULLSCREEN UNTUK SEMUA BUKU
    // ======================================

    fullscreenButton.addEventListener("click", async function () {

        try {

            if (!document.fullscreenElement) {

                if (bookFrame.requestFullscreen) {

                    await bookFrame.requestFullscreen();

                } else if (bookFrame.webkitRequestFullscreen) {

                    bookFrame.webkitRequestFullscreen();

                } else {

                    alert("Fullscreen tidak disokong oleh pelayar ini.");

                }

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.error("Fullscreen error:", error);

            alert("Maaf, fullscreen tidak dapat dibuka. Sila cuba sekali lagi.");

        }

    });


    // ======================================
    // KEMASKINI TEKS BUTANG FULLSCREEN
    // ======================================

    function updateFullscreenButton() {

        if (document.fullscreenElement === bookFrame) {

            fullscreenButton.textContent =
                "⛶ KELUAR FULLSCREEN";

        } else {

            fullscreenButton.textContent =
                "⛶ BESARKAN BUKU (FULLSCREEN)";

        }

    }

    document.addEventListener(
        "fullscreenchange",
        updateFullscreenButton
    );

    document.addEventListener(
        "webkitfullscreenchange",
        updateFullscreenButton
    );


    // ======================================
    // TERUSKAN KE PERMAINAN
    // ======================================

    document.getElementById("continueButton")
        .addEventListener("click", function () {

            if (!bookUrl) {

                alert("Sila pilih buku terlebih dahulu.");
                return;

            }

            location.href = "pilihpermainan.html";

        });

</script>

</body>
</html>
